plugins {
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

tasks.register('build') {
    group = 'build'
    description = 'Runs the unit tests and builds the Fabric and NeoForge jars for the selected Minecraft version.'
    dependsOn ':Common:test', ':Fabric:build', ':NeoForge:build'
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}
