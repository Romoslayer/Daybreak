plugins {
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
    id 'net.minecraftforge.gradle' version "${forgegradle_version}" apply false
    id 'net.minecraftforge.jarjar' version '0.2.3' apply false
}

tasks.register('build') {
    group = 'build'
    description = 'Runs the unit tests and builds the Fabric, NeoForge and Forge jars for the selected Minecraft version (-Pmc=...).'
    dependsOn ':Common:test', ':Fabric:build', ':NeoForge:build', ':Forge:build'
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}
