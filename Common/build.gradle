plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

// Plain Minecraft (no loader) through NeoForm, so nothing loader-specific can creep into the shared code
neoForge {
    neoFormVersion = neoform_version
}

repositories {
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public'
        content { includeGroupAndSubgroups('org.spongepowered') }
    }
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5'
    // Mixin config plugins see ASM class nodes; both loaders provide ASM at runtime
    compileOnly 'org.ow2.asm:asm-tree:9.8'
    // Fabric Loader and NeoForge both bundle MixinExtras
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixinextras_version}"

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Unit tests for the parts that need no running game: the time maths and the config
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

// ModDevGradle only puts Minecraft on the main classpath; the tests need it too
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

dependencies {
    // Compile-time stand-ins for optional mods (see Stubs/); never on a runtime classpath, never shipped
    compileOnly project(':Stubs')
}
