pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'daybreak'
include('Common', 'Fabric', 'NeoForge', 'Stubs')

// One source tree per game version family. The default is 26.3; others are added as versions/<mc>.properties.
// Everything that differs between versions lives in that file.
def mc = providers.gradleProperty('mc').getOrElse('26.3')
def versionFile = file("versions/${mc}.properties")
if (!versionFile.isFile()) {
    throw new GradleException("Unsupported Minecraft version '${mc}': ${versionFile} does not exist")
}
def versionProps = new Properties()
versionFile.withInputStream { versionProps.load(it) }
gradle.beforeProject { project ->
    versionProps.each { key, value -> project.ext.set(key as String, value) }
}
